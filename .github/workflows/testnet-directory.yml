name: Publish testnet ledger endpoints
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gpuchain-testnet-directory
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'hanchangha1127/GPUChain' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/sync-testnet-directory.mjs
      - name: Publish verified changes
        run: |
          set -eu
          if git diff --quiet -- networks/testnet-endpoints.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- networks/testnet-endpoints.json
          git commit -m 'Update verified public testnet ledger endpoints'
          git push origin HEAD:main
